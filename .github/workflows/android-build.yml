name: RVH Edu Android Build and Release Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    name: Verify and package RVH Edu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package has been retired. Explicitly install
          # only platform-tools; setup-android already installs cmdline-tools.
          packages: "platform-tools"

      - name: Install Android 16 SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configure optional release upload key
        env:
          RVH_RELEASE_KEYSTORE_BASE64: ${{ secrets.RVH_RELEASE_KEYSTORE_BASE64 }}
          RVH_RELEASE_STORE_PASSWORD: ${{ secrets.RVH_RELEASE_STORE_PASSWORD }}
          RVH_RELEASE_KEY_ALIAS: ${{ secrets.RVH_RELEASE_KEY_ALIAS }}
          RVH_RELEASE_KEY_PASSWORD: ${{ secrets.RVH_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RVH_RELEASE_KEYSTORE_BASE64" ] && [ -n "$RVH_RELEASE_STORE_PASSWORD" ] && [ -n "$RVH_RELEASE_KEY_ALIAS" ] && [ -n "$RVH_RELEASE_KEY_PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/rvh-release-signing"
            printf '%s' "$RVH_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rvh-release-signing/rvh-upload.jks"
            echo "RVH_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/rvh-release-signing/rvh-upload.jks" >> "$GITHUB_ENV"
            echo "RVH_RELEASE_STORE_PASSWORD=$RVH_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RVH_RELEASE_KEY_ALIAS=$RVH_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RVH_RELEASE_KEY_PASSWORD=$RVH_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release upload signing configured."
          else
            echo "Release signing secrets are not all configured; bundleRelease will produce an unsigned candidate and must NOT be uploaded to Play Console."
          fi

      - name: Run Android unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release Android App Bundle
        run: gradle bundleRelease --no-daemon

      - name: Verify build outputs
        run: |
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$(find app/build/outputs/bundle/release -name '*.aab' -type f -print -quit)"
          find app/build/outputs/apk/debug -name '*.apk' -type f -print
          find app/build/outputs/bundle/release -name '*.aab' -type f -print
          if [ -z "$RVH_RELEASE_KEYSTORE_PATH" ]; then
            echo "NOTICE: Release AAB is unsigned; configure release upload secrets before Play submission."
          fi

      - name: Upload debug APK and release bundle candidate
        uses: actions/upload-artifact@v4
        with:
          name: rvh-edu-build-candidates-v${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
